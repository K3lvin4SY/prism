name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
      prerelease:
        # A pre-release is skipped by the releases/latest download links in the READMEs.
        description: Mark as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The Panel the extensions build against; they link its SDK from .panel/packages/sdk.
  PANEL_REF: v2.0.0-beta.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Panel
        uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: ${{ env.PANEL_REF }}
          path: .panel

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prism-*/package-lock.json
            .panel/package-lock.json

      # The SDK is linked from .panel, so its stylesheets resolve their imports there:
      # panel.css imports tailwindcss and @tailwindcss/forms from the Panel's node_modules,
      # and theme-entry.css sources core-classes.txt, which the Panel generates and git ignores.
      # Without both, prism-themes fails with "ENOENT ... prism-themes/tailwindcss".
      - name: Prepare the Panel's SDK
        working-directory: .panel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/generate-core-classes.mjs

      - name: Build the extensions
        run: |
          for extension in prism-*/; do
            echo "::group::${extension%/}"
            (cd "$extension" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - name: Package the extensions
        # Release files are named without the version (prism-core.pteroext), so
        # releases/latest/download/<id>.pteroext always gets the newest one.
        run: |
          node scripts/pack.mjs --out release prism-*/
          for archive in release/*.pteroext; do
            mv "$archive" "${archive%-*.pteroext}.pteroext"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prism-${{ inputs.tag }}
          path: release/*.pteroext

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release create "$TAG" release/*.pteroext \
            --target "$GITHUB_SHA" \
            --title "Prism $TAG" \
            --generate-notes \
            $([ "$PRERELEASE" = true ] && echo --prerelease)
